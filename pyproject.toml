[project]
name = "agent-harness"
version = "0.1.0"
description = "A tiny, model-agnostic LLM agent harness built around tool calling."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agent-harness = "agent_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_harness"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
